<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commodity Deal Desk</title>
<style>
:root{--o:#5f7058;--d:#263226;--c:#f5f2e9;--p:#fbfaf6;--l:#dedfd6;--m:#687064}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--c);color:var(--d)}
header{background:var(--o);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
h1{font-size:22px;margin:0}.sub{opacity:.82;font-size:13px}.wrap{max-width:1200px;margin:auto;padding:26px 5%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px}
.num{font-size:30px;font-weight:750;margin-top:6px}.label{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#e3e8df;color:var(--d);font-weight:650;cursor:pointer;text-decoration:none;font-size:14px}
button.active,.primary{background:var(--o);color:white}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}
input{padding:11px 13px;border:1px solid var(--l);border-radius:10px;background:white;min-width:260px}
.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:800px;background:white}
th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #ecece6;font-size:13px}th{background:#eef1ea;position:sticky;top:0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf1e9;font-size:11px;font-weight:700}
.empty{text-align:center;padding:45px;color:var(--m)}footer{padding:25px 5%;color:var(--m);font-size:12px;text-align:center}
@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:18px}.card{padding:14px}input{width:100%;min-width:0}header{padding:16px 18px}}
</style></head><body>
<header><div><h1>Commodity Deal Desk</h1><div class="sub">Buyer · Seller · Offer · Match control panel</div></div>
<a class="btn" href="https://docs.google.com/spreadsheets/d/1MKLx8p6G01LJihZd9qc-4e2M11MV82VlevTgTSgpsVI/edit" target="_blank">Open Master Database</a></header>
<main class="wrap">
<section class="cards"><div class="card"><div class="label">Counterparties</div><div class="num" id="c0">0</div></div><div class="card"><div class="label">Buyer Requirements</div><div class="num" id="c1">0</div></div><div class="card"><div class="label">Seller Offers</div><div class="num" id="c2">0</div></div><div class="card"><div class="label">Active Matches</div><div class="num" id="c3">0</div></div></section>
<nav id="nav"></nav>
<section class="panel"><div class="toolbar"><div><strong id="title">Counterparties</strong><div class="sub">Verified working data only</div></div><input id="q" placeholder="Search company, commodity, country..."></div><div class="tablewrap" id="table"></div></section>
</main><footer>Commodity Deal Desk · Intermediary workflow · Binding trade actions remain with Senthil</footer>
<script>
let db={counterparties:[],buyers:[],sellers:[],matches:[],followups:[]},active="counterparties";
const cfg={counterparties:["Company","Country","Role","Commodities","Verification","Status"],buyers:["Buyer","Country","Commodity","Grade / Spec","Quantity","Destination","Incoterm","Status"],sellers:["Seller","Country","Commodity","Grade / Spec","Available Qty","Price","Origin","Incoterm","Validity","Status"],matches:["Buyer","Seller","Commodity","Quantity","Price / Basis","Match Status","Next Action"],followups:["Company","Role","Commodity","Action Due","Priority","Status","Next Action"]};
const keys={counterparties:["company","country","role","commodities","verification","status"],buyers:["buyer","country","commodity","spec","quantity","destination","incoterm","status"],sellers:["seller","country","commodity","spec","quantity","price","origin","incoterm","validity","status"],matches:["buyer","seller","commodity","quantity","price","status","next"],followups:["company","role","commodity","due","priority","status","next"]};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function render(){
 document.getElementById("c0").textContent=db.counterparties.length;document.getElementById("c1").textContent=db.buyers.length;document.getElementById("c2").textContent=db.sellers.length;document.getElementById("c3").textContent=db.matches.filter(x=>!/closed|rejected/i.test(x.status||"")).length;
 const labels={counterparties:"Counterparties",buyers:"Buyer Requirements",sellers:"Seller Offers",matches:"Matches",followups:"Follow-ups"};
 document.getElementById("nav").innerHTML=Object.entries(labels).map(([k,v])=>`<button class="${k===active?"active":""}" onclick="active='${k}';render()">${v}</button>`).join("");
 document.getElementById("title").textContent=labels[active];
 const q=document.getElementById("q").value.toLowerCase(), rows=db[active].filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 if(!rows.length){document.getElementById("table").innerHTML='<div class="empty">No records yet. Verified data will appear here as the deal desk runs.</div>';return}
 document.getElementById("table").innerHTML="<table><thead><tr>"+cfg[active].map(h=>"<th>"+h+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+keys[active].map((k,i)=>"<td>"+(i===keys[active].length-1?'<span class="pill">'+esc(r[k])+"</span>":esc(r[k]))+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
}
document.getElementById("q").addEventListener("input",render);
fetch("./data.json?v="+Date.now()).then(r=>r.json()).then(x=>{db=x;render()}).catch(render);render();
</script></body></html>
